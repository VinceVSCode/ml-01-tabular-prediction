name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Validate portfolio.json
        run: python scripts/validate_portfolio.py

      # The tests use made-up data and no network. The image is only built here:
      # running it would download the dataset and train the models.
      - name: Docker build
        run: docker compose build
